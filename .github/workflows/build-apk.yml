name: Build LJN Hotspot APK

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Ambil source code
        uses: actions/checkout@v4

      - name: Siapkan Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Siapkan Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Pasang kebutuhan Android
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Ekstrak source code
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          test -n "$ZIP_FILE"
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          test -f extracted/LJNHotspotAndroid/app/build.gradle

      - name: Build APK
        run: |
          curl -L https://services.gradle.org/distributions/gradle-8.9-bin.zip -o gradle.zip
          unzip -q gradle.zip
          ./gradle-8.9/bin/gradle \
            -p extracted/LJNHotspotAndroid assembleDebug

      - name: Simpan APK
        uses: actions/upload-artifact@v4
        with:
          name: LJN-Hotspot-Control-APK
          path: extracted/LJNHotspotAndroid/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
